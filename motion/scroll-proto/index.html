<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Region 2 scroll prototype</title>
<style>
  @font-face { font-family: 'Creato Display'; src: url('/fonts/creato_display/CreatoDisplay-Regular.otf') format('opentype'); font-weight: 400; }
  @font-face { font-family: 'Creato Display'; src: url('/fonts/creato_display/CreatoDisplay-Medium.otf') format('opentype'); font-weight: 500; }
  @font-face { font-family: 'Creato Display'; src: url('/fonts/creato_display/CreatoDisplay-Bold.otf') format('opentype'); font-weight: 600; }
  :root { --bg: #F5F5F4; --ink: #1C1917; --muted: #78716C; --line: #E7E5E4; --accent: #EA580C; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 'Creato Display', system-ui, sans-serif; }
  .intro, .filler, .after, .stack { max-width: 680px; margin: 0 auto; padding: 0 16px; }
  .intro { padding-top: 72px; }
  .intro h1 { font-size: 28px; line-height: 1.2; margin: 0 0 8px; }
  .intro p { color: var(--muted); margin: 0 0 32px; }
  .filler p { color: var(--muted); margin: 0 0 24px; }
  .filler .tag { color: var(--ink); font-weight: 600; }
  .after { padding-top: 48px; padding-bottom: 8px; font-size: 22px; }
  .after:focus { outline: none; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* variant toggle */
  .toggle { position: fixed; top: 12px; right: 12px; z-index: 10; display: flex; gap: 2px; padding: 3px; margin: 0;
    background: #fff; border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 2px 10px rgba(0,0,0,.08); font-size: 14px; }
  .toggle button { font: inherit; font-weight: 500; border: 0; border-radius: 999px; padding: 6px 12px; background: transparent; color: var(--muted); cursor: pointer; }
  .toggle button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .toggle.note { padding: 7px 14px; color: var(--muted); }

  /* pinned section: 4 viewport heights of pinned scroll */
  .pin { position: relative; height: 500vh; height: 500svh; margin: 48px 0; }
  .stage { position: sticky; top: 0; height: 100vh; height: 100svh; display: grid;
    grid-template-columns: auto minmax(0, 360px); justify-content: center; align-items: center; gap: 48px; padding: 24px; }
  .phone { height: calc(100svh - 48px); aspect-ratio: 960 / 1008; max-width: calc(100vw - 360px - 48px - 48px); pointer-events: none; }
  /* soften the crop's side edges so the clip's background glow doesn't read as a box */
  .phone, .stack .still { -webkit-mask-image: linear-gradient(to right, transparent, #000 4%, #000 96%, transparent);
    mask-image: linear-gradient(to right, transparent, #000 4%, #000 96%, transparent); }
  .copy { position: relative; }
  .meta { display: flex; align-items: baseline; gap: 14px; margin-top: 12px; color: var(--muted); font-size: 14px; }
  .count { font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  .lines { display: grid; }
  .lines .line { grid-area: 1 / 1; align-self: end; margin: 0; font-size: 34px; line-height: 1.15; font-weight: 600; opacity: 0; transform: translateY(8px);
    transition: opacity .25s ease, transform .25s ease; }
  .lines .line[data-on="true"] { opacity: 1; transform: none; }
  /* scroll cue: fades in after the animation has been still for a moment (main.tsx sets data-on) */
  .cue { display: flex; align-items: center; gap: 6px; margin-top: 18px; color: var(--muted); font-size: 14px; font-weight: 500;
    letter-spacing: .04em; opacity: 0; transition: opacity .2s ease; }
  .cue[data-on="true"] { opacity: 1; transition-duration: .5s; }
  .cue[data-on="true"] svg { animation: cue-bob 1.4s ease-in-out infinite; }
  @keyframes cue-bob { 0%, 100% { transform: translateY(-2px); } 50% { transform: translateY(3px); } }
  .skip { color: var(--muted); }
  .skip:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  @media (max-width: 760px) {
    .stage { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; align-content: center; justify-items: center; gap: 16px; padding: 56px 16px 20px; }
    .phone { height: auto; width: 100%; max-width: none; max-height: calc(100svh - 56px - 20px - 16px - 120px); }
    .copy { width: 100%; min-height: 96px; text-align: center; }
    .lines .line { font-size: 22px; }
    .cue { justify-content: center; margin-top: 10px; }
    .meta { justify-content: center; margin-top: 6px; }
  }

  /* reduced motion: a plain stack of stills */
  .stack { margin-top: 48px; }
  .stack h2 { font-size: 22px; }
  .stack ol { list-style: none; padding: 0; margin: 0; }
  .stack li { margin: 0 0 40px; }
  .stack .still { aspect-ratio: 960 / 1008; width: 100%; max-width: 480px; margin: 0 auto; }
  .stack .line { text-align: center; font-size: 22px; font-weight: 600; margin: 8px 0 0; }
  @media (prefers-reduced-motion: reduce) { .lines .line { transition: none; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/main.js"></script>
</body>
</html>
